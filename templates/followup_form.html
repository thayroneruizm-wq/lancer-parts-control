{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="overline">FOLLOW-UPS / AGENDA COMERCIAL</span><h1>{{ 'Editar follow-up' if is_edit else 'Agendar follow-up' }}</h1><p>Defina uma próxima ação clara para não perder a negociação.</p></div><a href="/followups" class="btn">← Voltar</a></div>
<form method="post" class="panel form-card stack-form"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Cliente *<select name="client_id" required><option value="">Selecione...</option>{% for c in clients %}<option value="{{ c.id }}" {{ 'selected' if item.client_id==c.id else '' }}>{{ c.name }}</option>{% endfor %}</select></label><label>Produto de interesse *<input name="product" required value="{{ item.product or '' }}" placeholder="Ex.: Intake Full Inox"></label><label>Valor informado (R$)<input name="quoted_value" inputmode="decimal" value="{{ '%.2f'|format((item.quoted_value_cents or 0)/100) }}"></label><label>Próximo contato *<input type="datetime-local" required name="due_at" value="{{ (item.due_at or '')[:16] }}"></label><label>Prioridade<select name="priority">{% for x in priorities %}<option value="{{ x }}" {{ 'selected' if item.priority==x else '' }}>{{ x }}</option>{% endfor %}</select></label><label>Categoria<select name="category"><option value="">Sem categoria</option>{% for x in categories %}<option value="{{ x }}" {{ 'selected' if item.category==x else '' }}>{{ x }}</option>{% endfor %}</select></label><label>Responsável<select name="owner_id">{% for x in users %}<option value="{{ x.id }}" {{ 'selected' if item.owner_id==x.id or (not item.owner_id and user.id==x.id) else '' }}>{{ x.name }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="Pendente" {{ 'selected' if item.status=='Pendente' else '' }}>Pendente</option><option value="Concluído" {{ 'selected' if item.status=='Concluído' else '' }}>Concluído</option></select></label><label>Objeção do cliente<input name="objection" value="{{ item.objection or '' }}" placeholder="Frete, preço, prazo..."></label><label>Recorrência (observação)<input name="recurring" value="{{ item.recurring or '' }}" placeholder="Ex.: mensal — ainda sem automação"></label><label class="span-2">Observações<textarea name="notes" rows="4">{{ item.notes or '' }}</textarea></label></div><div class="form-actions"><a href="/followups" class="btn">Cancelar</a><button class="btn btn-primary">✓ Salvar follow-up</button></div></form>{% endblock %}
