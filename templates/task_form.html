{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="overline">PLANEJAMENTO / NOVA ATIVIDADE</span><h1>Nova tarefa</h1><p>Defina a responsabilidade, o prazo e a prioridade.</p></div><a href="/tasks" class="btn">← Voltar</a></div><form method="post" class="panel form-card stack-form"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label class="span-2">Título *<input name="title" required maxlength="180" placeholder="Ex.: Conferir embalagem do coletor"></label><label>Prazo<input type="datetime-local" name="due_at"></label><label>Prioridade<select name="priority">{% for p in priorities %}<option value="{{ p }}" {{ 'selected' if p=='Média' else '' }}>{{ p }}</option>{% endfor %}</select></label><label>Repetir<select name="recurrence">{% for r in recurrences %}<option value="{{ r }}">{{ r or 'Não repetir' }}</option>{% endfor %}</select></label><label>Responsável<select name="assignee_id">{% for u in users %}<option value="{{ u.id }}" {{ 'selected' if user.id==u.id else '' }}>{{ u.name }}</option>{% endfor %}</select></label>{% if clients %}<label>Cliente vinculado<select name="client_id"><option value="">Sem cliente</option>{% for c in clients %}<option value="{{ c.id }}" {{ 'selected' if item.client_id==c.id else '' }}>{{ c.name }}</option>{% endfor %}</select></label>{% endif %}{% if orders %}<label>Pedido vinculado<select name="order_id"><option value="">Sem pedido</option>{% for o in orders %}<option value="{{ o.id }}" {{ 'selected' if item.order_id==o.id else '' }}>#{{ o.order_number }}</option>{% endfor %}</select></label>{% endif %}<label class="span-2">Descrição<textarea name="description" rows="4"></textarea></label></div><div class="form-actions"><a href="/tasks" class="btn">Cancelar</a><button class="btn btn-primary">✓ Criar tarefa</button></div></form>{% endblock %}
