{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="overline">FUNIL / {{ 'EDIÇÃO' if is_edit else 'NOVA OPORTUNIDADE' }}</span><h1>{{ 'Editar oportunidade' if is_edit else 'Nova oportunidade' }}</h1><p>Registre uma negociação e sua próxima etapa comercial.</p></div><a href="/opportunities" class="btn">← Voltar</a></div>
<form method="post" class="panel form-card stack-form"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Cliente *<select name="client_id" required><option value="">Selecione...</option>{% for c in clients %}<option value="{{ c.id }}" {{ 'selected' if item.client_id==c.id else '' }}>{{ c.name }}</option>{% endfor %}</select></label><label>Produto desejado *<input name="product" required value="{{ item.product or '' }}" placeholder="Ex.: Coletor 4x2x1 Full Inox"></label><label>Valor estimado (R$)<input name="value" value="{{ '%.2f'|format((item.value_cents or 0)/100) }}" inputmode="decimal"></label><label>Probabilidade (%)<input type="number" name="probability" min="0" max="100" value="{{ item.probability if item.probability is not none else 30 }}"></label><label>Etapa atual<select name="stage">{% for s in stages %}<option value="{{ s }}" {{ 'selected' if item.stage==s else '' }}>{{ s }}</option>{% endfor %}</select></label><label>Fechamento previsto<input type="date" name="expected_close" value="{{ item.expected_close or '' }}"></label><label>Origem<input name="source" value="{{ item.source or '' }}" placeholder="WhatsApp, Instagram, site..."></label><label>Vendedor responsável<select name="owner_id">{% for x in users %}<option value="{{ x.id }}" {{ 'selected' if item.owner_id==x.id or (not item.owner_id and user.id==x.id) else '' }}>{{ x.name }}</option>{% endfor %}</select></label><label>Motivo de perda (se aplicável)<select name="loss_reason">{% for x in loss_reasons %}<option value="{{ x }}" {{ 'selected' if item.loss_reason==x else '' }}>{{ x or 'Não se aplica' }}</option>{% endfor %}</select></label><label class="span-2">Observações<textarea name="notes" rows="4">{{ item.notes or '' }}</textarea></label></div><div class="form-actions"><a href="/opportunities" class="btn">Cancelar</a><button class="btn btn-primary">✓ Salvar oportunidade</button></div></form>{% endblock %}
